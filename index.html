<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OK.M Gestão de Oficinas</title>
    
    <!-- Ícone do Aplicativo para Celular e Navegador -->
    <link rel="icon" type="image/jpeg" href="logo.jpg">
    <link rel="apple-touch-icon" href="logo.jpg">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --accent-color: #0284c7;
            --accent-hover: #0369a1;
            --text-color: #f8fafc;
            --card-bg: #1e293b;
            --border-color: #334155;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .navbar {
            background-color: var(--bg-secondary) !important;
            border-bottom: 1px solid var(--border-color);
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
        }

        .form-control, .form-select {
            background-color: #0f172a;
            border-color: var(--border-color);
            color: #fff;
        }

        .form-control:focus, .form-select:focus {
            background-color: #0f172a;
            color: #fff;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 0.25rem rgba(2, 132, 199, 0.25);
        }

        .btn-primary {
            background-color: var(--accent-color);
            border-color: var(--accent-color);
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
            border-color: var(--accent-hover);
        }

        .table {
            color: var(--text-color);
        }

        .table-dark {
            --bs-table-bg: var(--bg-secondary);
            --bs-table-border-color: var(--border-color);
        }

        /* Modal custom dark */
        .modal-content {
            background-color: var(--bg-secondary);
            color: var(--text-color);
            border: 1px solid var(--border-color);
        }

        @media print {
            body * {
                visibility: hidden;
            }
            #printableArea, #printableArea * {
                visibility: visible;
            }
            #printableArea {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                color: #000 !important;
                background: #fff !important;
            }
            .no-print {
                display: none !important;
            }
        }
    </style>
</head>
<body>

    <!-- NAV BAR -->
    <nav class="navbar navbar-expand-lg navbar-dark mb-4">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center gap-2" href="#">
                <img src="logo.jpg" alt="Logo" width="35" height="35" class="rounded-circle d-inline-block align-text-top" onerror="this.style.display='none'">
                <strong>OK.M Gestão de Oficinas</strong>
            </a>
            <div class="d-flex align-items-center gap-3">
                <span id="userInfo" class="text-light fw-bold"></span>
                <button id="btnLogout" class="btn btn-outline-danger btn-sm" onclick="logout()" style="display:none;">Sair</button>
            </div>
        </div>
    </nav>

    <div class="container">
        <!-- TELA DE LOGIN -->
        <div id="loginSection" class="row justify-content-center">
            <div class="col-md-4 mt-5">
                <div class="card p-4 shadow-lg">
                    <div class="text-center mb-4">
                        <img src="logo.jpg" alt="Logo" class="img-fluid rounded-circle mb-3" style="max-width: 100px;" onerror="this.style.display='none'">
                        <h4>Acesso ao Sistema</h4>
                    </div>
                    <form id="loginForm" onsubmit="realizarLogin(event)">
                        <div class="mb-3">
                            <label class="form-label">Usuário</label>
                            <input type="text" id="loginUsuario" class="form-control" required placeholder="Digite o usuário">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Senha</label>
                            <input type="password" id="loginSenha" class="form-control" required placeholder="Digite a senha">
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Entrar</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- CONTEÚDO PRINCIPAL (OCULTO ANTES DO LOGIN) -->
        <div id="appSection" style="display: none;">
            
            <!-- PAINEL DE AÇÕES -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h3>Ordens de Serviço</h3>
                <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalNovaOS">
                    <i class="bi bi-plus-circle me-1"></i> Nova Ordem de Serviço
                </button>
            </div>

            <!-- FILTROS -->
            <div class="card p-3 mb-4">
                <div class="row g-3">
                    <div class="col-md-4">
                        <input type="text" id="buscaOS" class="form-control" placeholder="Buscar por cliente ou ID..." onkeyup="filtrarTabela()">
                    </div>
                    <div class="col-md-3">
                        <select id="filtroStatus" class="form-select" onchange="filtrarTabela()">
                            <option value="">Todos os Status</option>
                            <option value="Aguardando Pecas">Aguardando Peças</option>
                            <option value="Em Servico">Em Serviço</option>
                            <option value="Pronto">Pronto</option>
                            <option value="Entregue">Entregue</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- TABELA DE ORDENS DE SERVIÇO -->
            <div class="card p-3 shadow-sm">
                <div class="table-responsive">
                    <table class="table table-dark table-hover align-middle">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Cliente</th>
                                <th>Mecânico</th>
                                <th>Atendente</th>
                                <th>Status</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="tabelaOS">
                            <!-- Preenchido via Firebase Firestore -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL NOVA / EDITAR OS -->
    <div class="modal fade" id="modalNovaOS" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">Cadastrar Nova OS</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="formOS" onsubmit="salvarOS(event)">
                        <input type="hidden" id="osDocId">
                        
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">Nome do Cliente</label>
                                <input type="text" id="clienteNome" class="form-control" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Telefone do Cliente</label>
                                <input type="text" id="clienteFone" class="form-control" required>
                            </div>

                            <div class="col-md-4">
                                <label class="form-label">Atendente</label>
                                <input type="text" id="atendente" class="form-control" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Mecânico</label>
                                <input type="text" id="mecanico" class="form-control" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Status</label>
                                <select id="status" class="form-select" required>
                                    <option value="Aguardando Pecas">Aguardando Peças</option>
                                    <option value="Em Servico">Em Serviço</option>
                                    <option value="Pronto">Pronto</option>
                                    <option value="Entregue">Entregue</option>
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Data de Início</label>
                                <input type="datetime-local" id="dataInicio" class="form-control" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Previsão de Término</label>
                                <input type="datetime-local" id="dataTermino" class="form-control">
                            </div>

                            <div class="col-12">
                                <label class="form-label">Serviço Realizado / Observações</label>
                                <textarea id="servicoRealizado" class="form-control" rows="3"></textarea>
                            </div>

                            <div class="col-12">
                                <label class="form-label">Checklist / Observações do Veículo</label>
                                <textarea id="checklistObs" class="form-control" rows="2"></textarea>
                            </div>
                        </div>

                        <div class="modal-footer mt-4 px-0 pb-0">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                            <button type="submit" class="btn btn-primary">Salvar no Banco</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL IMPRESSÃO -->
    <div class="modal fade" id="modalImprimir" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header no-print">
                    <h5 class="modal-title">Visualização de Impressão</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body bg-white text-dark p-4" id="printableArea">
                    <!-- Preenchido dinamicamente ao clicar em Imprimir -->
                </div>
                <div class="modal-footer no-print">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
                    <button type="button" class="btn btn-success" onclick="imprimirOS()"><i class="bi bi-printer"></i> Imprimir</button>
                </div>
            </div>
        </div>
    </div>

    <!-- BOOTSTRAP JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/bootstrap.bundle.min.js"></script>

    <!-- FIREBASE SDKs (MÓDULOS) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getFirestore, 
            collection, 
            addDoc, 
            onSnapshot, 
            doc, 
            updateDoc, 
            deleteDoc, 
            query, 
            orderBy,
            serverTimestamp 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Configuração do seu Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyDummyKeyReplaceIfNeed",
            authDomain: "okm-gestao.firebaseapp.com",
            projectId: "okm-gestao",
            storageBucket: "okm-gestao.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abcdef"
        };

        // Inicializar Firebase e Firestore
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Usuários Permitidos
        const usuariosValidos = {
            "LUCAS": "4958",
            "TIAGO": "1234"
        };

        let listaOSGeral = [];

        // --- SISTEMA DE LOGIN ---
        window.realizarLogin = function(e) {
            e.preventDefault();
            const user = document.getElementById('loginUsuario').value.toUpperCase().trim();
            const pass = document.getElementById('loginSenha').value.trim();

            if (usuariosValidos[user] && usuariosValidos[user] === pass) {
                localStorage.setItem('okm_user', user);
                carregarTelaApp(user);
            } else {
                alert('Usuário ou senha incorretos!');
            }
        };

        window.logout = function() {
            localStorage.removeItem('okm_user');
            document.getElementById('loginSection').style.display = 'block';
            document.getElementById('appSection').style.display = 'none';
            document.getElementById('btnLogout').style.display = 'none';
            document.getElementById('userInfo').innerText = '';
        };

        function carregarTelaApp(usuario) {
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('appSection').style.display = 'block';
            document.getElementById('btnLogout').style.display = 'block';
            document.getElementById('userInfo').innerText = 'Olá, ' + usuario;
            escutarBancoDados();
        }

        // Verificar login salvo ao abrir
        const usuarioSalvo = localStorage.getItem('okm_user');
        if (usuarioSalvo) {
            carregarTelaApp(usuarioSalvo);
        }

        // --- ESCUTAR MUDANÇAS NO FIRESTORE (TEMPO REAL) ---
        function escutarBancoDados() {
            const q = query(collection(db, "ordens_servico"), orderBy("criadoEm", "desc"));
            onSnapshot(q, (snapshot) => {
                listaOSGeral = [];
                snapshot.forEach((docSnap) => {
                    listaOSGeral.push({
                        docId: docSnap.id,
                        ...docSnap.data()
                    });
                });
                renderizarTabela(listaOSGeral);
            }, (error) => {
                console.error("Erro ao carregar dados do Firebase:", error);
            });
        }

        // --- RENDERIZAR TABELA ---
        function renderizarTabela(lista) {
            const tbody = document.getElementById('tabelaOS');
            tbody.innerHTML = '';

            if(lista.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted">Nenhuma Ordem de Serviço encontrada.</td></tr>';
                return;
            }

            lista.forEach((os) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>${os.id || 'N/A'}</strong></td>
                    <td>${os.clienteNome || ''}<br><small class="text-muted">${os.clienteFone || ''}</small></td>
                    <td>${os.mecanico || ''}</td>
                    <td>${os.atendente || ''}</td>
                    <td><span class="badge bg-${getBadgeColor(os.status)}">${os.status || ''}</span></td>
                    <td>
                        <button class="btn btn-sm btn-outline-info me-1" onclick="prepararImpressao('${os.docId}')"><i class="bi bi-printer"></i></button>
                        <button class="btn btn-sm btn-outline-warning me-1" onclick="editarOS('${os.docId}')"><i class="bi bi-pencil"></i></button>
                        <button class="btn btn-sm btn-outline-danger" onclick="deletarOSDirect('${os.docId}', event)"><i class="bi bi-trash"></i></button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function getBadgeColor(status) {
            switch(status) {
                case 'Aguardando Pecas': return 'warning';
                case 'Em Servico': return 'primary';
                case 'Pronto': return 'info';
                case 'Entregue': return 'success';
                default: return 'secondary';
            }
        }

        // --- FILTRAR OS ---
        window.filtrarTabela = function() {
            const busca = document.getElementById('buscaOS').value.toLowerCase();
            const status = document.getElementById('filtroStatus').value;

            const filtradas = listaOSGeral.filter(os => {
                const bateuBusca = (os.clienteNome && os.clienteNome.toLowerCase().includes(busca)) ||
                                   (os.id && os.id.toLowerCase().includes(busca));
                const bateuStatus = status === "" || os.status === status;
                return bateuBusca && bateuStatus;
            });

            renderizarTabela(filtradas);
        };

        // --- SALVAR / EDITAR OS NO FIRESTORE ---
        window.salvarOS = async function(e) {
            e.preventDefault();
            const docId = document.getElementById('osDocId').value;

            const dadosOS = {
                clienteNome: document.getElementById('clienteNome').value,
                clienteFone: document.getElementById('clienteFone').value,
                atendente: document.getElementById('atendente').value,
                mecanico: document.getElementById('mecanico').value,
                status: document.getElementById('status').value,
                dataInicio: document.getElementById('dataInicio').value,
                dataTermino: document.getElementById('dataTermino').value,
                servicoRealizado: document.getElementById('servicoRealizado').value,
                checklistObs: document.getElementById('checklistObs').value
            };

            try {
                if (docId) {
                    // Editar existente
                    await updateDoc(doc(db, "ordens_servico", docId), dadosOS);
                } else {
                    // Criar Nova
                    dadosOS.id = "OS-" + Math.floor(1000 + Math.random() * 9000);
                    dadosOS.criadoEm = serverTimestamp();
                    await addDoc(collection(db, "ordens_servico"), dadosOS);
                }

                // Fechar modal e resetar formulário
                const modal = bootstrap.Modal.getInstance(document.getElementById('modalNovaOS'));
                modal.hide();
                document.getElementById('formOS').reset();
                document.getElementById('osDocId').value = '';

            } catch (err) {
                alert("Erro ao salvar no banco de dados: " + err.message);
            }
        };

        // --- EDITAR ---
        window.editarOS = function(docId) {
            const os = listaOSGeral.find(item => item.docId === docId);
            if(!os) return;

            document.getElementById('osDocId').value = os.docId;
            document.getElementById('clienteNome').value = os.clienteNome || '';
            document.getElementById('clienteFone').value = os.clienteFone || '';
            document.getElementById('atendente').value = os.atendente || '';
            document.getElementById('mecanico').value = os.mecanico || '';
            document.getElementById('status').value = os.status || 'Em Servico';
            document.getElementById('dataInicio').value = os.dataInicio || '';
            document.getElementById('dataTermino').value = os.dataTermino || '';
            document.getElementById('servicoRealizado').value = os.servicoRealizado || '';
            document.getElementById('checklistObs').value = os.checklistObs || '';

            document.getElementById('modalTitle').innerText = 'Editar Ordem de Serviço (' + (os.id || '') + ')';
            const modal = new bootstrap.Modal(document.getElementById('modalNovaOS'));
            modal.show();
        };

        // --- DELETAR ---
        window.deletarOSDirect = async function(id, e) {
            if(confirm("Tem certeza que deseja excluir esta Ordem de Serviço?")) {
                try {
                    await deleteDoc(doc(db, "ordens_servico", id));
                } catch(err) {
                    alert("Erro ao deletar: " + err.message);
                }
            }
        };

        // --- PREPARAR IMPRESSÃO ---
        window.prepararImpressao = function(docId) {
            const os = listaOSGeral.find(item => item.docId === docId);
            if(!os) return;

            const area = document.getElementById('printableArea');
            area.innerHTML = `
                <div class="text-center mb-4 border-bottom pb-3">
                    <h2>OK.M GESTÃO DE OFICINAS</h2>
                    <p class="mb-0">Comprovante de Ordem de Serviço - <strong>${os.id || ''}</strong></p>
                </div>
                <div class="row mb-3">
                    <div class="col-6"><strong>Cliente:</strong> ${os.clienteNome || ''}</div>
                    <div class="col-6"><strong>Telefone:</strong> ${os.clienteFone || ''}</div>
                </div>
                <div class="row mb-3">
                    <div class="col-6"><strong>Atendente:</strong> ${os.atendente || ''}</div>
                    <div class="col-6"><strong>Mecânico:</strong> ${os.mecanico || ''}</div>
                </div>
                <div class="row mb-3">
                    <div class="col-6"><strong>Data Início:</strong> ${os.dataInicio || ''}</div>
                    <div class="col-6"><strong>Previsão Término:</strong> ${os.dataTermino || ''}</div>
                </div>
                <div class="mb-3">
                    <strong>Status Atual:</strong> ${os.status || ''}
                </div>
                <div class="mb-3">
                    <strong>Serviço Realizado:</strong>
                    <p class="border p-2 rounded bg-light">${os.servicoRealizado || 'Nenhum informado.'}</p>
                </div>
                <div class="mb-3">
                    <strong>Checklist / Observações do Veículo:</strong>
                    <p class="border p-2 rounded bg-light">${os.checklistObs || 'Nenhuma informada.'}</p>
                </div>
                <div class="mt-5 text-center border-top pt-3">
                    <p>____________________________________________________<br>Assinatura do Cliente</p>
                </div>
            `;

            const modal = new bootstrap.Modal(document.getElementById('modalImprimir'));
            modal.show();
        };

        window.imprimirOS = function() {
            window.print();
        };
    </script>
</body>
</html>
